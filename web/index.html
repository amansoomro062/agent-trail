<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="description" content="agenttrail - see what your agents did" />
    <title>agenttrail</title>
    <script>
      // Resolve the theme before first paint so there is no flash.
      (function () {
        var t = null;
        try {
          t =
            new URLSearchParams(location.search).get('theme') ||
            localStorage.getItem('agenttrail-theme');
        } catch (e) {}
        // light is the product's default; dark is opt-in via the toggle
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
